<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Studio Rita</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Tuffy:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" defer></script>
</head>
<body>
    <section class="section services">
        <span class="services__heading">
            <h1>Studio Rita</h1>
            <p>Escolha um serviço para agendar</p>
        </span>
        <!__ Requisito RF01: Listagem de serviços __>
        <div id="services__list"></div>
    </section>

    <section class="section agenda">
        <div id="agenda__list-days" class="agenda__list">
            <h2>Agende seu serviço</h2>
            <div class="agenda__days">
                <span class="agenda__day">Seg</span>
                <span class="agenda__day">Ter</span>
                <span class="agenda__day">Qua</span>
                <span class="agenda__day">Qui</span>
                <span class="agenda__day">Sex</span>
                <span class="agenda__day">Sáb</span>
                <span class="agenda__dom">Dom</span>
            </div>
        </div>

        <div id="agenda__list-hours" class="agenda__list">
            <h2>Escolha seu horário</h2>
            <div class="agenda__hours">
                <span class="agenda__hour">09:00</span>
                <span class="agenda__hour">09:30</span>
                <span class="agenda__hour">10:00</span>
                <span class="agenda__hour">10:30</span>
                <span class="agenda__hour">11:00</span>
                <span class="agenda__hour">14:00</span>
                <span class="agenda__hour">14:30</span>
                <span class="agenda__hour">15:00</span>
                <span class="agenda__hour">15:30</span>
                <span class="agenda__hour">16:00</span>
                <span class="agenda__hour">16:30</span>
                <span class="agenda__hour">17:00</span>
            </div>
        </div>
    </section>
</body>
</html>
